services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: internship_signal
      POSTGRES_PASSWORD: internship_signal_dev
      POSTGRES_DB: internship_signal
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship_signal -d internship_signal"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - internship_signal_postgres:/var/lib/postgresql/data

volumes:
  internship_signal_postgres:
