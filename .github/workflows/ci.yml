name: ci

# Validates every product commit. It runs only against throwaway services on
# the runner: no Railway, email, production database, or job-board credentials
# are available to it, and it does not gate Railway deployments by itself.
"on":
  push:
    branches: [product-mvp]
  pull_request:
    branches: [product-mvp]

permissions:
  contents: read

# Superseded pull-request runs are cancelled; every product-mvp push keeps its
# own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: backend and watcher (Python 3.11, PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .:backend
      # The fixtures create and drop their own scratch databases here.
      HOSTED_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
      # PostgreSQL 18 client and server tools for the backup tests.
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install PostgreSQL 18 tools and age
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          # Only the binaries are needed; never start a cluster on the runner.
          echo "create_main_cluster = false" | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18 age
          "$PG_BIN/pg_dump" --version
          age --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python .github/scripts/check_constraints.py backend/constraints.txt

      - name: Compile Python sources
        run: python -m compileall -q backend watcher internship_signal ops

      - name: Run backend and watcher tests
        run: >-
          python -m pytest backend/tests watcher/tests
          -p no:cacheprovider -q -rs --junitxml=pytest-results.xml

      - name: Build and smoke-test the backup image
        run: |
          docker build --file ops/backup/Dockerfile --tag findsooner-backup:ci .
          docker run --rm findsooner-backup:ci sh -c \
            'pg_dump --version && initdb --version && age --version && python3 -c "import psycopg" && python3 -m ops.backup.pgbackup --help'

      # PostgreSQL tests skip when their database is unusable, so a run is
      # only trusted when the skips are exactly the two known ones.
      - name: Verify only expected tests were skipped
        if: always()
        run: python .github/scripts/check_skips.py pytest-results.xml

  frontend:
    name: frontend (Node.js 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
